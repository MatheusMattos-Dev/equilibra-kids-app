<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- Soft-corner Squircle Background -->
  <rect width="480" height="480" x="16" y="16" rx="115" fill="url(#bg-gradient)" />
  <rect width="476" height="476" x="18" y="18" rx="113" stroke="white" stroke-width="4" stroke-opacity="0.2" />

  <defs>
    <!-- Background Gradient (Vibrant purple to cyber blue) -->
    <linearGradient id="bg-gradient" x1="16" y1="16" x2="496" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Drop Shadow for Premium Elevation -->
    <filter id="premium-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Owl Design Elements (Identical to AuthPage.tsx mascot, scaled and centered) -->
  <g transform="translate(56, 40) scale(2.0)" filter="url(#premium-shadow)">
    <!-- Orelhas/Penas da cabeça -->
    <path d="M40 70 L60 40 L90 50 Z" fill="#9e74d6" />
    <path d="M160 70 L140 40 L110 50 Z" fill="#9e74d6" />
    <!-- Corpo -->
    <circle cx="100" cy="115" r="65" fill="#decbf2" />
    <!-- Barriga pastel -->
    <circle cx="100" cy="125" r="45" fill="#f9f6fc" />
    <!-- Asas -->
    <path d="M35 110 Q15 130 45 155 Z" fill="#7b53b2" />
    <path d="M165 110 Q185 130 155 155 Z" fill="#7b53b2" />
    <!-- Olhos (Grandes e fofos) -->
    <circle cx="72" cy="90" r="22" fill="#fff" />
    <circle cx="128" cy="90" r="22" fill="#fff" />
    <!-- Pupilas com brilhos -->
    <circle cx="72" cy="90" r="10" fill="#334155" />
    <circle cx="128" cy="90" r="10" fill="#334155" />
    <circle cx="75" cy="87" r="4" fill="#fff" />
    <circle cx="131" cy="87" r="4" fill="#fff" />
    <!-- Bochechas rosadas -->
    <circle cx="56" cy="112" r="7" fill="#ffcbd8" />
    <circle cx="144" cy="112" r="7" fill="#ffcbd8" />
    <!-- Bico -->
    <path d="M100 95 L93 108 L107 108 Z" fill="#f1c43f" />
    <!-- Patinhas -->
    <circle cx="85" cy="178" r="8" fill="#f1c43f" />
    <circle cx="115" cy="178" r="8" fill="#f1c43f" />
  </g>

  <!-- Premium Glassmorphic Shine Reflection -->
  <path d="M16 16 L496 16 L496 240 L16 380 Z" fill="white" opacity="0.08" />
</svg>